# Note that the service name must match what is in the corresponding docker compose
environment_path: .

# Path to directory containing variable values for each host
host_vars_path: host_vars

# This must match exactly with the docker-compose.yml file
services:
  ndnd:
    enabled_by: ndnd_enabled
    profile: ndnd
    template_path: templates/ndnd
    render_path: dist/ndnd

  ndnd-dv:
    enabled_by: ndnd_dv_enabled
    profile: ndnd-dv
    template_path: templates/ndnd-dv
    render_path: dist/ndnd-dv-independent

  ndnd-http-status-server:
    enabled_by: ndnd_enabled
    profile: ndnd
    pass: on

  ndnd-pingserver:
    enabled_by: ndnd_dv_enabled
    profile: ndnd-dv
    template_path: templates/ndnd-pingserver
    render_path: dist/ndnd-pingserver

  ndnd-root-ca:
    enabled_by: ndnd_enabled
    host_from_global: ndnd_ca_host
    profile: ndnd-root-ca
    template_path: templates/ndnd-root-ca
    render_path: dist/ndnd-root-ca

  ndnd-root-http-ca:
    enabled_by: ndnd_enabled
    host_from_global: ndnd_ca_host
    profile: ndnd-root-ca
    pass: on

  caddy:
    template_path: templates/caddy
    render_path: dist/caddy

  nfd:
    template_path: templates/nfd
    render_path: dist/nfd

  nfd-http-status-server:
    pass: on

  ndnpingserver:
    template_path: templates/ndnpingserver
    render_path: dist/ndnpingserver

  serve-certs:
    pass: on

  nlsr:
    template_path: templates/nlsr
    render_path: dist/nlsr

  mongodb:
    pass: on

  ndn-python-repo:
    template_path: templates/ndn-python-repo
    render_path: dist/ndn-python-repo

  ndnd-repo:
    template_path: templates/ndnd-repo
    render_path: dist/ndnd-repo

  ndnd-merkle:
    hosts: [UCLA]
    profile: merkle-log
    template_path: templates/ndnd-merkle
    render_path: dist/ndnd-merkle

  ndncert:
    template_path: templates/ndncert
    render_path: dist/ndncert

  root-http-ca:
    template_path: templates/root-http-ca
    render_path: dist/root-http-ca

  root-ndncert:
    template_path: templates/root-ndncert
    render_path: dist/root-ndncert

  file-server:
    template_path: templates/file-server
    render_path: dist/file-server

# Global variables that are available in all templates
globals:
  ndnNetwork: /ndn
  hyperbolic_state: "off"
  tcp_port: 6363
  udp_port: 6363
  multicast_port: 56363
  supports_guest_certs: False
  operator_user: ndnops
  root_ca_https: https://suns.cs.ucla.edu/root-ca
  # Explicitly select the active root; retain additional roots here during rollover.
  ndnd_repo_anchors:
    - anchors/ndn-testbed-root.ndncert.2204.base64
  ndnd_udp_port: 6364
  ndnd_dv_network: /ndnd
  ndnd_ca_host: UCLA
  ndnd_root_ca_profile_url: https://suns.cs.ucla.edu/file-server/ndnd/ndnd-ca-profile.json
  ndnd_root_certificate_url: https://suns.cs.ucla.edu/file-server/ndnd/ndnd-root.ndncert
  ndnd_root_http_ca_url: https://suns.cs.ucla.edu/ndnd-ca
  ndnd_root_certificate_sha256: ""
  ndnd_root_anchor_path: dist/ndnd-dv-independent/anchors/ndnd-root.base64
  ndnd_links:
    - { a: UCLA, b: ARIZONA, cost: 1 }
    - { a: UCLA, b: MEMPHIS, cost: 1 }
    - { a: ARIZONA, b: MEMPHIS, cost: 1 }

# Declare variables available for each host
# You can use lint.py to check variables, their types and
# reformat the host_vars correctly
variables:
  site: string
  site_name: string
  operator_name: string
  operator_email: string
  ansible_host: string
  host_ip: string
  local_ip: string
  outgoing_subnets: "?list"
  site_email_domain: list
  default_prefix: string
  advertised_prefixes: list
  routable_prefixes: list
  network_regions: list
  router_name: string
  http_access: string
  memsize: number
  neighbors: dict
  position: list
  hr_angle: number
  hr_radius: number
  ethernet_device: string
  is_root_ca: "?boolean"
  is_status_page: "?boolean"
  ndnd_enabled: "?boolean"
  ndnd_dv_enabled: "?boolean"
  ndnd_router_prefix: "?string"
